<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Must News — 히스토리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #0a0a0f 0%, #12121a 100%);
    color: #e0e0e0; min-height: 100vh; line-height: 1.6;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }

  /* 세 페이지 공통 내비게이션 */
  .nav { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .nav a {
    color: #9aa4c0; text-decoration: none; font-size: .86rem; font-weight: 600;
    padding: 7px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
  }
  .nav a:hover { color: #fff; border-color: rgba(255,255,255,.25); }
  .nav a.on { color: #fff; background: rgba(148,163,255,.18); border-color: rgba(148,163,255,.45); }

  header { text-align: center; margin-bottom: 22px; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, #64748b, #475569);
    padding: 6px 18px; border-radius: 20px; font-size: .85rem; font-weight: 600;
    margin-bottom: 12px; color: #fff;
  }
  h1 { font-size: 1.4rem; color: #fff; margin-bottom: 6px; }
  .sub { color: #888; font-size: .85rem; }

  .daygroup { margin-bottom: 18px; }
  .dayhead {
    font-size: .82rem; color: #94a3b8; font-weight: 700; letter-spacing: .02em;
    padding: 0 2px 7px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 9px;
  }
  .ed {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px; padding: 11px 13px; margin-bottom: 7px; cursor: pointer;
    color: inherit; font-family: inherit; font-size: inherit;
  }
  .ed:hover { background: rgba(255,255,255,.07); border-color: rgba(148,163,255,.35); }
  .ed.on { background: rgba(148,163,255,.12); border-color: rgba(148,163,255,.5); }
  .ed .time { flex: 0 0 auto; min-width: 3.6em; font-weight: 800; color: #94a3ff; font-size: .92rem; padding-top: 1px; }
  /* span은 인라인이라 그대로 두면 말줄임이 안 먹고 버튼이 내용만큼 늘어난다 —
     display:block + min-width:0 이 둘 다 있어야 좁은 화면에서 넘치지 않는다 */
  .ed .info { display: block; flex: 1 1 auto; min-width: 0; }
  .ed .toptitle {
    display: block; color: #dbe1f5; font-size: .88rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ed .stat { margin-top: 4px; font-size: .74rem; color: #6b7280; display: flex; gap: 9px; flex-wrap: wrap; }

  .panel { margin-top: 26px; }
  .panelhead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 14px;
  }
  .panelhead h2 { font-size: 1.05rem; color: #fff; }
  .panelhead .meta { font-size: .8rem; color: #888; }

  .item {
    display: flex; gap: 13px; align-items: flex-start;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .item.top3 { background: rgba(148,163,255,.06); border-color: rgba(148,163,255,.22); }
  .rank { min-width: 2em; text-align: center; font-weight: 800; color: #94a3ff; padding-top: 1px; }
  .item.top3 .rank { color: #c7d2fe; }
  .body { flex: 1; min-width: 0; }
  .title a { color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem; }
  .title a:hover { color: #c7d2fe; text-decoration: underline; }
  .meta2 { margin-top: 5px; font-size: .76rem; color: #888; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .src { color: #94a3ff; font-weight: 600; }
  .chip { background: rgba(148,163,255,.14); color: #c7d2fe; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .scoop { background: rgba(34,197,94,.15); color: #86efac; border-radius: 4px; padding: 1px 6px; font-weight: 700; }
  .vs { color: #555; }

  .state { text-align: center; color: #888; padding: 44px 0; }
  footer { text-align: center; margin-top: 34px; color: #666; font-size: .84rem; }
  footer a { color: #94a3ff; text-decoration: none; }
  @media (max-width: 480px) {
    .item { padding: 11px; gap: 9px; }
    .title a { font-size: .9rem; }
    .ed { padding: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="./">지금</a>
    <a href="weekly.html">주간</a>
    <a href="history.html" class="on">히스토리</a>
  </nav>

  <header>
    <div class="badge">🗂 히스토리</div>
    <h1>지난 회차 다시 보기</h1>
    <p class="sub" id="sub">불러오는 중…</p>
  </header>

  <main id="list"><p class="state">회차 목록을 불러오는 중입니다…</p></main>
  <section class="panel" id="panel"></section>

  <footer>
    <p>발행 회차마다 그 시점 TOP30을 그대로 보관합니다</p>
  </footer>
</div>

<script>
(function () {
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var bust = function (u) { return u + (u.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now(); };
  var listEl = document.getElementById('list');
  var panelEl = document.getElementById('panel');
  var editions = [];

  // '20260813_1840' → { date:'2026-08-13', time:'18:40', label:'8/13(수)' }
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function parseStamp(s) {
    var m = String(s).match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})$/);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    return {
      key: m[1] + '-' + m[2] + '-' + m[3],
      time: m[4] + ':' + m[5],
      label: (+m[2]) + '/' + (+m[3]) + '(' + WD[d.getDay()] + ')'
    };
  }

  function renderList() {
    // 날짜별로 묶는다 (최신 날짜가 위, 그 안에서 늦은 시각이 위)
    var groups = [], byKey = {};
    editions.forEach(function (e) {
      var p = parseStamp(e.stamp);
      if (!p) return;
      e._p = p;
      if (!byKey[p.key]) { byKey[p.key] = { key: p.key, label: p.label, items: [] }; groups.push(byKey[p.key]); }
      byKey[p.key].items.push(e);
    });

    var html = '';
    groups.forEach(function (g) {
      html += '<div class="daygroup"><div class="dayhead">' + esc(g.label) + '</div>';
      g.items.forEach(function (e) {
        html += '<button type="button" class="ed" data-stamp="' + esc(e.stamp) + '">'
          + '<span class="time">' + esc(e._p.time) + '</span>'
          + '<span class="info">'
          + '<span class="toptitle">' + esc(e.top || '(제목 없음)') + '</span>'
          + '<span class="stat">'
          + '<span>' + e.n + '건</span>'
          + '<span>매체 ' + e.sources + '곳</span>'
          + (e.avgOutlets ? '<span>평균 보도 ' + e.avgOutlets + '곳</span>' : '')
          + '</span></span></button>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html || '<p class="state">보관된 회차가 없습니다.</p>';
  }

  function loadEdition(stamp) {
    [].forEach.call(document.querySelectorAll('.ed'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-stamp') === stamp);
    });
    panelEl.innerHTML = '<p class="state">불러오는 중…</p>';

    fetch(bust('data/archive/' + stamp + '.json'))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var p = parseStamp(stamp);
        var arts = d.articles || [];
        var html = '<div class="panelhead"><h2>' + esc(p ? p.label + ' ' + p.time : stamp) + '</h2>'
          + '<span class="meta">' + esc(d.updated || '') + ' 발행 · 최근 ' + esc(d.window_hours || '?') + '시간 집계</span></div>';

        arts.forEach(function (a) {
          var n = a.outlets || (a.sources ? a.sources.length : 1);
          var chip = n > 1 ? '<span class="chip">' + n + '개 매체</span>' : '';
          var scoop = a.scoop ? '<span class="scoop">최초 보도</span>' : '';
          var pl = a.placement
            ? '<span>' + (a.placement === 'hero' ? '네이버 TOP3'
                : a.placement === 'featured' ? '네이버 랭킹 상위'
                : a.placement === 'section' ? '네이버 IT섹션' : '네이버 랭킹') + '</span>' : '';
          html += '<div class="item' + (a.rank <= 3 ? ' top3' : '') + '">'
            + '<div class="rank">' + a.rank + '</div><div class="body">'
            + '<div class="title"><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></div>'
            + '<div class="meta2"><span class="src">' + esc(a.source) + '</span>' + scoop + chip + pl
            + '<span class="vs">VS ' + esc(a.vs) + '</span></div>'
            + '</div></div>';
        });
        panelEl.innerHTML = html;
        panelEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (e) {
        panelEl.innerHTML = '<p class="state">이 회차를 불러오지 못했습니다 (' + esc(e.message) + ')</p>';
      });
  }

  listEl.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.ed[data-stamp]') : null;
    if (!btn) return;
    var stamp = btn.getAttribute('data-stamp');
    location.hash = stamp;          // 공유·북마크 가능하게
    loadEdition(stamp);
  });

  window.addEventListener('hashchange', function () {
    var s = (location.hash || '').replace('#', '');
    if (s) loadEdition(s);
  });

  fetch(bust('data/archive/index.json'))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (idx) {
      editions = idx.editions || [];
      if (!editions.length) throw new Error('empty');
      document.getElementById('sub').textContent =
        '총 ' + editions.length + '회차 · ' + (idx.updated || '') + ' 기준';
      renderList();
      var want = (location.hash || '').replace('#', '');
      var pick = editions.filter(function (e) { return e.stamp === want; })[0] || editions[0];
      loadEdition(pick.stamp);
    })
    .catch(function () {
      document.getElementById('sub').textContent = '';
      listEl.innerHTML = '<p class="state">보관된 회차 목록이 아직 없습니다.<br>'
        + '다음 발행부터 쌓입니다.<br><a href="./" style="color:#94a3ff">지금 랭킹 보기 →</a></p>';
    });
})();
</script>
</body>
</html>
