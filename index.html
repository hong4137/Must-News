<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Must News — 국내 IT 랭킹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #0a0a0f 0%, #12121a 100%);
    color: #e0e0e0; min-height: 100vh; line-height: 1.6;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 36px 16px 60px; }
  header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 6px 18px; border-radius: 20px; font-size: .85rem; font-weight: 600;
    margin-bottom: 14px; color: #fff;
  }
  h1 { font-size: 1.5rem; color: #fff; margin-bottom: 6px; }
  .updated { color: #888; font-size: .85rem; }
  .updated .dot { color: #22c55e; margin-right: 4px; }

  .item {
    display: flex; gap: 14px; align-items: flex-start;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    transition: background .2s, border-color .2s;
  }
  .item:hover { background: rgba(255,255,255,.06); border-color: rgba(102,126,234,.35); }
  .rank {
    min-width: 2.1em; text-align: center; font-weight: 800; font-size: 1.05rem;
    color: #667eea; padding-top: 1px;
  }
  .item.top3 .rank { color: #ff8c42; font-size: 1.15rem; }
  .item.top3 { background: rgba(255,140,66,.05); border-color: rgba(255,140,66,.2); }
  .body { flex: 1; min-width: 0; }
  .title a { color: #fff; text-decoration: none; font-weight: 600; font-size: .98rem; }
  .title a:hover { color: #8fa6ff; text-decoration: underline; }
  .meta { margin-top: 6px; font-size: .78rem; color: #888; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .src { color: #667eea; font-weight: 600; }
  .multi {
    background: rgba(102,126,234,.15); color: #a5b4fc; border-radius: 4px;
    padding: 1px 7px; font-weight: 600;
    border: 0; font-family: inherit; font-size: inherit; cursor: pointer;
  }
  .multi:hover { background: rgba(102,126,234,.3); color: #c7d2fe; }
  .multi[aria-expanded="true"] { background: rgba(102,126,234,.35); color: #e0e7ff; }
  .multi .caret { display: inline-block; margin-left: 3px; font-size: .7em; }
  .multi[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .related { margin-top: 10px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 8px; }
  .related[hidden] { display: none; }
  .related li { list-style: none; margin: 5px 0; font-size: .84rem; line-height: 1.45; }
  .related a { color: #b8c4e8; text-decoration: none; }
  .related a:hover { color: #fff; text-decoration: underline; }
  .related .rsrc { color: #667eea; font-weight: 600; margin-right: 6px; }
  .related .more { margin-top: 7px; font-size: .8rem; }
  .related .more a { color: #8fa6ff; }
  .vs { color: #555; }
  .placement { color: #ff8c42; }
  footer { text-align: center; margin-top: 36px; color: #666; font-size: .85rem; }
  footer a { color: #667eea; text-decoration: none; }
  .state { text-align: center; color: #888; padding: 50px 0; }
  @media (max-width: 480px) {
    .item { padding: 12px; gap: 10px; }
    .title a { font-size: .92rem; }
    /* 데스크톱에선 20px이라 손가락으로 누르기 어렵다 — 터치 타깃을 키운다 */
    .multi { padding: 6px 11px; min-height: 32px; display: inline-flex; align-items: center; }
    .related li { margin: 8px 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">📡 Must News</div>
    <h1>지금 중요한 국내 IT 뉴스</h1>
    <p class="updated" id="updated">불러오는 중…</p>
  </header>

  <main id="list"><p class="state">랭킹을 불러오는 중입니다…</p></main>

  <footer>
    <p>매일 08시·18시 자동 갱신 · 13개 매체 교차 채점</p>
    <p style="margin-top:6px">
      <a href="weekly.html">주간 랭킹</a> ·
      <a href="https://hong4137.github.io/briefing/">외신 브리핑</a> ·
      <a href="https://hong4137.github.io/briefing/archive.html">아카이브</a></p>
  </footer>
</div>

<script>
(function () {
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  fetch('data/ranking.json?t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      document.getElementById('updated').innerHTML =
        '<span class="dot">●</span>' + esc(data.updated) + ' 갱신 · 최근 ' + esc(data.window_hours) + '시간';

      var html = '';
      (data.articles || []).forEach(function (a, idx) {
        // 매체 수는 outlets(네이버 집계 우선)를 쓴다. sources.length는 우리가 수집한
        // 매체만 세므로 과소 표시된다 — 실측: SKT 기사가 4개로 뜨는데 실제 16곳.
        var n = a.outlets || (a.sources ? a.sources.length : 1);
        var members = a.members || [];
        var panelId = 'rel' + idx;

        var multi = '';
        if (n > 1) {
          multi = members.length
            ? '<button type="button" class="multi" aria-expanded="false" aria-controls="' + panelId + '"'
              + ' data-panel="' + panelId + '">' + n + '개 매체<span class="caret">▾</span></button>'
            : '<span class="multi">' + n + '개 매체</span>';
        }

        var placement = a.placement
          ? '<span class="placement">네이버 ' + (a.placement === 'hero' ? 'TOP3'
              : a.placement === 'featured' ? '랭킹 상위'
              : a.placement === 'section' ? 'IT섹션' : '랭킹') + '</span>' : '';

        var related = '';
        if (members.length) {
          related = '<ul class="related" id="' + panelId + '" hidden>';
          members.forEach(function (m) {
            related += '<li><span class="rsrc">' + esc(m.source) + '</span>'
              + '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.title) + '</a></li>';
          });
          // 우리가 가진 것보다 네이버 집계가 크면 나머지는 네이버에서 볼 수 있게 안내
          var shown = members.length + 1;
          if (a.naverCluster && n > shown) {
            related += '<li class="more"><a href="https://news.naver.com/cluster/'
              + esc(a.naverCluster) + '/section/105" target="_blank" rel="noopener">'
              + '네이버에서 ' + n + '곳 전체 보기 →</a></li>';
          }
          related += '</ul>';
        }

        html += '<div class="item' + (a.rank <= 3 ? ' top3' : '') + '">'
          + '<div class="rank">' + a.rank + '</div>'
          + '<div class="body">'
          + '<div class="title"><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></div>'
          + '<div class="meta"><span class="src">' + esc(a.source) + '</span>' + multi + placement
          + '<span>' + esc((a.publishedAt || '').slice(5, 16)) + '</span>'
          + '<span class="vs">VS ' + esc(a.vs) + '</span></div>'
          + related
          + '</div></div>';
      });
      var list = document.getElementById('list');
      list.innerHTML = html || '<p class="state">최근 기사가 없습니다.</p>';

      // 펼치기 — 항목마다 리스너를 달지 않고 위임 하나로 처리한다
      list.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.multi[data-panel]') : null;
        if (!btn) return;
        var panel = document.getElementById(btn.getAttribute('data-panel'));
        if (!panel) return;
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        panel.hidden = open;
      });
    })
    .catch(function (e) {
      document.getElementById('list').innerHTML =
        '<p class="state">랭킹을 불러오지 못했습니다 (' + esc(e.message) + ')<br>첫 발행 전이라면 scoreAndPublishKr() 실행 후 2~3분 뒤 새로고침하세요.</p>';
      document.getElementById('updated').textContent = '';
    });
})();
</script>
</body>
</html>
